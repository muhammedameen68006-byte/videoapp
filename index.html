<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Video Library</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
    }

    /* Video Upload Section */
    .upload-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      text-align: center;
      border: 2px dashed var(--accent-color);
    }

    .upload-section label {
      cursor: pointer;
      display: inline-block;
      padding: 10px 20px;
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .upload-section label:hover {
      background-color: #0284c7;
      color: #fff;
    }

    .upload-section input[type="file"] {
      display: none;
    }

    /* Video Grid - Centered */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      justify-content: center;
      justify-items: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 350px;
      text-align: left;
    }

    .video-card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #000;
    }

    .video-info {
      padding: 15px;
    }

    .video-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .video-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Footer Styling */
    footer {
      background-color: var(--card-bg);
      border-top: 1px solid #334155;
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 40px;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Modal Overlay for Registration Form */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      text-align: left;
    }

    .modal-card h2 {
      color: var(--accent-color);
      margin-bottom: 10px;
      text-align: center;
    }

    .modal-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #0284c7;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Registration Modal Popup -->
  <div class="modal-overlay" id="registrationModal">
    <div class="modal-card">
      <h2>Welcome</h2>
      <p>Please enter your details to access the video library.</p>
      
      <form action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSeILLf-qHkGeYq00t88JFow2uri1Wnh2aOjC4pOVJfhCZmFaw/formResponse" 
            method="POST" 
            target="hidden_iframe" 
            onsubmit="handleFormSubmit()">
            
        <!-- Name Field mapped to entry.1556710637 -->
        <div class="form-group">
          <label for="userName">Full Name</label>
          <input type="text" id="userName" name="entry.1556710637" placeholder="Enter your full name" required>
        </div>

        <!-- Mobile Number Field mapped to entry.663697952 -->
        <div class="form-group">
          <label for="userPhone">Mobile Number</label>
          <input type="tel" id="userPhone" name="entry.663697952" placeholder="Enter your phone number" required pattern="[0-9]{10}">
        </div>

        <button type="submit" class="submit-btn">Continue to Videos</button>
      </form>
    </div>
  </div>

  <!-- Hidden iframe for smooth form submission without leaving page -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <div class="container">
    <header>
      <h1>CP AMEEN'S PC SOFTWARE INSTALLATION GUIDE APP</h1>
    </header>

    <!-- Video Grid (Combined both videos inside one properly styled container) -->
    <div class="video-grid" id="videoGrid">
      <div class="video-card">
        <video controls>
          <source src="chrome.mp4" type="video/mp4">
        </video>
        <div class="video-info">
          <div class="video-title">GOOGLE CHROME</div>
          <div class="video-desc">Google Chrome installing Guide</div>
        </div>
      </div>


  <!-- Website Footer -->
  <footer>
    <p>&copy; Designed & Developed by CP AMEEN.</p>
  </footer>

  <script>
    // Local Video Player Handler
    const videoInput = document.getElementById('videoInput');
    const videoGrid = document.getElementById('videoGrid');

    if (videoInput) {
      videoInput.addEventListener('change', function(event) {
        const files = event.target.files;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const videoURL = URL.createObjectURL(file);

          const card = document.createElement('div');
          card.className = 'video-card';

          const video = document.createElement('video');
          video.controls = true;
          video.src = videoURL;

          const info = document.createElement('div');
          info.className = 'video-info';

          const title = document.createElement('div');
          title.className = 'video-title';
          title.textContent = file.name;

          const desc = document.createElement('div');
          desc.className = 'video-desc';
          desc.textContent = `Size: ${(file.size / (1024 * 1024)).toFixed(2)} MB`;

          info.appendChild(title);
          info.appendChild(desc);
          card.appendChild(video);
          card.appendChild(info);

          videoGrid.prepend(card);
        }
      });
    }

    // Form Submission Handling
    function handleFormSubmit() {
      // Hide modal popup after submission
      setTimeout(() => {
        document.getElementById('registrationModal').style.display = 'none';
      }, 500);
    }
  </script>
</body>
</html>
